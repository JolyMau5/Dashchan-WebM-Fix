name: Build WebM libraries with HEVC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-30" "build-tools;30.0.2" "ndk;21.3.6528147"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.3.6528147" >> "$GITHUB_ENV"
          test -x "$ANDROID_SDK_ROOT/ndk/21.3.6528147/ndk-build"

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl xz-utils bzip2 python3 python-is-python3 meson ninja-build
          meson --version
          ninja --version
          python --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.9.4'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          printf 'store.file=keystore.jks\nstore.password=%s\nkey.alias=%s\nkey.password=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          test -s keystore.jks
          test -s keystore.properties

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect and verify signed APK
        run: |
          set -euo pipefail
          APK="$(find build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*-signed.apk' | head -n1)"
          test -n "$APK"
          cp "$APK" build/outputs/apk/release/DashchanWebm-hevc-signed.apk
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/30.0.2"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs \
            build/outputs/apk/release/DashchanWebm-hevc-signed.apk

      - name: Show artifacts
        run: |
          ls -lh build/outputs/apk/release/
          sha256sum build/outputs/apk/release/*.apk

      - name: Upload APK and external files
        uses: actions/upload-artifact@v4
        with:
          name: DashchanWebm-hevc-1.7
          path: |
            build/outputs/apk/release/*.apk
            build/outputs/external/**
          if-no-files-found: error
